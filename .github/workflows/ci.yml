name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Deliberately NOT UTC. A zip's DOS timestamp is local time, so a mtime
      # fixed in UTC fell below fflate's 1980 floor everywhere west of
      # Greenwich - `bootstrap`, `deploy` and `analytics bootstrap` all threw
      # for most of the Americas while this suite stayed green, because it ran
      # at TZ=UTC, the one setting where the bug is invisible. Seven analytics
      # tests already covered the path; only the zone was wrong. A western zone
      # is the strictly better default: it catches the negative-offset class,
      # and the whole suite is zone-robust (verified across UTC, New York,
      # Kiritimati and Kolkata).
      - run: pnpm test
        env:
          TZ: America/New_York
      - run: pnpm lint
      # Scope lives in .oxfmtrc.json (ignorePatterns), so a bare `.` is safe:
      # it formats TypeScript and JavaScript and skips prose, generated files,
      # and hand-tuned config. Fix locally with `pnpm exec oxfmt .`.
      - run: pnpm exec oxfmt --check .
      - run: pnpm knip

  browser:
    runs-on: ubuntu-24.04-arm
    container:
      # Playwright 1.63.0, Noble, Linux ARM64: matches the committed screenshot baselines.
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:ui
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-acceptance
          path: |
            playwright-report/
            test-results/
          retention-days: 14
