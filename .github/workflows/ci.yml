name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Deliberately NOT UTC. A zip's DOS timestamp is local time, so a mtime
      # fixed in UTC fell below fflate's 1980 floor everywhere west of
      # Greenwich - `bootstrap`, `deploy` and `analytics bootstrap` all threw
      # for most of the Americas while this suite stayed green, because it ran
      # at TZ=UTC, the one setting where the bug is invisible. Seven analytics
      # tests already covered the path; only the zone was wrong. A western zone
      # is the strictly better default: it catches the negative-offset class,
      # and the whole suite is zone-robust (verified across UTC, New York,
      # Kiritimati and Kolkata).
      - run: pnpm test
        env:
          TZ: America/New_York
      - run: pnpm lint
      # Scope lives in .oxfmtrc.json (ignorePatterns), so a bare `.` is safe:
      # it formats TypeScript and JavaScript and skips prose, generated files,
      # and hand-tuned config. Fix locally with `pnpm exec oxfmt .`.
      - run: pnpm exec oxfmt --check .
      - run: pnpm knip
